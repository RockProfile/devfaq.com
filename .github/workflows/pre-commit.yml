name: pre-commit

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - 'development'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pre-commit/action@v3.0.1
